<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="UTF-8">
  <title>Liên Hệ - Kế Toán TCP</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/style.css">
  <!-- Font Awesome CDN -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css" />
  <style>
    .main-nav-bar ul li a {
      color: #1f365c;
      font-weight: bold;
      font-size: 18px;
      text-decoration: none;
      align-items: center;
      gap: 8px;
    }

    .main-nav-bar ul li {
      transition: border-color 0.2s;
    }

    .main-nav-bar ul li:last-child {
      border-right: none;
    }

    .main-nav-bar ul li a:hover {
      color: #ffb536;
    }

    .hotline span:last-child {
      font-size: 38px;
      color: #1f365c;
      font-weight: bold;
    }
  </style>
</head>

<body>
  <div id="header-placeholder"></div>
  <script>
    fetch('header.html')
      .then(response => response.text())
      .then(html => {
        document.getElementById('header-placeholder').innerHTML = html;
      });
  </script>

  <section class="contact">
    <div class="max-w-7xl mx-auto px-4 py-12">
      <h2 class="text-3xl font-bold mb-8 text-center">Liên hệ với chúng tôi</h2>
      <form action="https://formspree.io/f/xrblaeqb" method="POST"
        class="max-w-lg mx-auto bg-white rounded-xl shadow p-8 flex flex-col gap-4"
        onsubmit="return handleContactSubmit(event)">
        <input type="text" name="Họ và tên" placeholder="Họ và tên" required
          class="border rounded px-4 py-2 focus:outline-none focus:ring-2 focus:ring-[#1f365c]">
        <input type="email" name="Email" placeholder="Email" required
          class="border rounded px-4 py-2 focus:outline-none focus:ring-2 focus:ring-[#1f365c]">
        <textarea name="Nội dung" placeholder="Nội dung..." rows="5"
          class="border rounded px-4 py-2 focus:outline-none focus:ring-2 focus:ring-[#1f365c]"></textarea>
        <button type="submit"
          class="bg-[#1f365c] text-white px-6 py-2 rounded font-semibold hover:bg-[#ffb536] transition">Gửi</button>
      </form>
      <div id="contact-success" class="max-w-lg mx-auto mt-6 text-green-600 text-center font-semibold hidden">
        Gửi liên hệ thành công! Chúng tôi sẽ phản hồi qua email sớm nhất.
      </div>
  </section>

  <div id="footer-placeholder"></div>
  <script>
    fetch('footer.html')
      .then(response => response.text())
      .then(html => {
        document.getElementById('footer-placeholder').innerHTML = html;
      });
  </script>

  <script>
    // filepath: c:\Windows-D\04-Project\03-VuTrungKien\HappyBirthDayMyGirl\contact.html
    function handleContactSubmit(e) {
      e.preventDefault();
      var form = e.target;
      var data = new FormData(form);
      fetch(form.action, {
        method: "POST",
        body: data,
        headers: {
          'Accept': 'application/json'
        }
      }).then(response => {
        if (response.ok) {
          form.style.display = "none";
          document.getElementById("contact-success").classList.remove("hidden");
        } else {
          alert("Có lỗi xảy ra, vui lòng thử lại!");
        }
      }).catch(() => {
        alert("Có lỗi xảy ra, vui lòng thử lại!");
      });
      return false;
    }
  </script>
</body>

</html>
