<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="UTF-8">
  <title>Trang Chủ - Kế Toán TCP</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/style.css">
  <!-- Font Awesome CDN -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css" />
  <style>
    .main-nav-bar ul li a {
      color: #1f365c;
      font-weight: bold;
      font-size: 18px;
      text-decoration: none;
      align-items: center;
      gap: 8px;
    }

    .main-nav-bar ul li {
      transition: border-color 0.2s;
    }

    .main-nav-bar ul li:last-child {
      border-right: none;
    }

    .main-nav-bar ul li a:hover {
      color: #ffb536;
    }

    .hotline span:last-child {
      font-size: 38px;
      color: #1f365c;
      font-weight: bold;
    }
  </style>
</head>

<body>
  <div id="header-placeholder"></div>
  <script>
    fetch('header.html')
      .then(response => response.text())
      .then(html => {
        document.getElementById('header-placeholder').innerHTML = html;
      });
  </script>
  <section class="hero">
    <div class="max-w-7xl mx-auto px-4 text-center py-12">
      <h2 class="text-3xl font-bold mb-4">Dịch vụ kế toán chuyên nghiệp</h2>
      <p class="mb-6">Giúp doanh nghiệp tối ưu chi phí, minh bạch sổ sách và đúng pháp luật</p>
      <a href="services.html"
        class="btn bg-[#1f365c] text-white px-6 py-2 rounded font-semibold hover:bg-[#ffb536] transition">Xem dịch
        vụ</a>
    </div>
  </section>

  <div id="footer-placeholder"></div>

  <script>
    fetch('footer.html')
      .then(response => response.text())
      .then(html => {
        document.getElementById('footer-placeholder').innerHTML = html;
      });
  </script>


</body>

</html>
